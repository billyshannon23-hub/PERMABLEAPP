name: Build desktop app

# Builds the Video Autopilot installers and puts them on the "app" release page:
#   https://github.com/<you>/<repo>/releases/tag/app
# Runs when the app's code changes in the main (template) repo, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  smoke:
    # Opens the real app on a virtual screen and fails if the first screen is blank.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.is_template || github.repository == 'billyshannon23-hub/PERMABLEAPP'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: mkdir -p dist && xvfb-run --auto-servernum node test/smoke.js
      - name: Make sure the download page exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view app --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create app --repo "$GITHUB_REPOSITORY" --title "Video Autopilot app" --latest \
              --notes "Download **Video-Autopilot-Setup.exe** for Windows or **Video-Autopilot-Mac.dmg** for Mac, open it, and follow the steps."

  build:
    needs: smoke
    # Only build in the original repo (or when someone runs it by hand), not in every co-worker's copy.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.is_template || github.repository == 'billyshannon23-hub/PERMABLEAPP'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13]  # macos-13 (Intel) has more free machines; the build is universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # each installer goes up as soon as it's built, so Windows never waits for a Mac machine
      - name: Publish to the download page
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg)
          ls -la "${files[@]}"
          gh release upload app "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
